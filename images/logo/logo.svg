<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="50%" stop-color="#FF8533"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF6B00" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)">
    <!-- Shield Base -->
    <path d="M 30 2 C 45 2, 58 10, 58 22 C 58 42, 30 56, 30 58 C 30 56, 2 42, 2 22 C 2 10, 15 2, 30 2 Z" fill="url(#shieldGrad)" />
    <!-- Inner Flame -->
    <path d="M 30 12 C 30 12 39 23 39 33 C 39 41 34 46 30 46 C 26 46 21 41 21 33 C 21 27 25 21 30 12 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
    <!-- Inner Flame Core Accent -->
    <path d="M 30 24 C 30 24 34 30 34 36 C 34 40 32 42 30 42 C 28 42 26 40 26 36 C 26 32 28 28 30 24 Z" fill="#FFF2E6" opacity="0.9"/>
  </g>

  <!-- Text Brand -->
  <text x="80" y="38" font-family="'Poppins', sans-serif" font-weight="800" font-size="22" fill="#0F172A" letter-spacing="-0.5">ORIGINAL</text>
  <text x="195" y="38" font-family="'Poppins', sans-serif" font-weight="800" font-size="22" fill="#FF6B00" letter-spacing="-0.5">HEATING</text>
  <text x="80" y="55" font-family="'Poppins', sans-serif" font-weight="600" font-size="10" fill="#64748B" letter-spacing="1.8">LIMITED • NORTHERN IRELAND</text>

  <!-- Gas Safe Registered Tiny Badge Accent -->
  <rect x="80" y="61" width="135" height="12" rx="3" fill="#FFF7ED" stroke="#FFD8A8" stroke-width="0.5"/>
  <text x="85" y="70" font-family="'Poppins', sans-serif" font-weight="700" font-size="7.5" fill="#C2410C">✓ GAS SAFE REGISTERED</text>
</svg>
